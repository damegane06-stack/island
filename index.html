<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#b7dbf4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作業島">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>作業島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --sky-a:#b7dbf4; --sky-b:#e4eff8; --sky-c:#fbe5d8;
    --ink:#1b2130; --ink-2:#4e596b; --ink-3:#8a93a2;
    --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.92);
    --edge:rgba(27,33,48,.11); --ghost:rgba(27,33,48,.05);
    --panel:#ffffff; --star:0;
    --orb:#fff7dc; --orb-glow:rgba(255,232,160,.5);
    --shadow:0 10px 30px -12px rgba(30,40,70,.38);
    --hot:#b8514a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sky-a:#060b22; --sky-b:#141b45; --sky-c:#35285a;
      --ink:#eef1f8; --ink-2:#b3bbcc; --ink-3:#7f889b;
      --glass:rgba(18,22,40,.7); --glass-2:rgba(24,28,50,.92);
      --edge:rgba(255,255,255,.13); --ghost:rgba(255,255,255,.06);
      --panel:#161a2c; --star:1;
      --orb:#eef0ff; --orb-glow:rgba(160,178,255,.32);
      --shadow:0 12px 34px -12px rgba(0,0,0,.75);
      --hot:#ef8a80;
    }
  }
  :root[data-theme="dark"]{
    --sky-a:#060b22; --sky-b:#141b45; --sky-c:#35285a;
    --ink:#eef1f8; --ink-2:#b3bbcc; --ink-3:#7f889b;
    --glass:rgba(18,22,40,.7); --glass-2:rgba(24,28,50,.92);
    --edge:rgba(255,255,255,.13); --ghost:rgba(255,255,255,.06);
    --panel:#161a2c; --star:1;
    --orb:#eef0ff; --orb-glow:rgba(160,178,255,.32);
    --shadow:0 12px 34px -12px rgba(0,0,0,.75);
    --hot:#ef8a80;
  }
  /* 昼／夜ボタンで切り替えたとき（島の空と画面の色を揃える） */
  body.is-day{
    --sky-a:#b7dbf4; --sky-b:#e4eff8; --sky-c:#fbe5d8;
    --ink:#1b2130; --ink-2:#4e596b; --ink-3:#8a93a2;
    --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.92);
    --edge:rgba(27,33,48,.11); --ghost:rgba(27,33,48,.05);
    --panel:#ffffff; --star:0;
    --orb:#fff7dc; --orb-glow:rgba(255,232,160,.5);
    --shadow:0 10px 30px -12px rgba(30,40,70,.38);
    --hot:#b8514a;
  }
  body.is-night{
    --sky-a:#060b22; --sky-b:#141b45; --sky-c:#35285a;
    --ink:#eef1f8; --ink-2:#b3bbcc; --ink-3:#7f889b;
    --glass:rgba(18,22,40,.7); --glass-2:rgba(24,28,50,.92);
    --edge:rgba(255,255,255,.13); --ghost:rgba(255,255,255,.06);
    --panel:#161a2c; --star:1;
    --orb:#eef0ff; --orb-glow:rgba(160,178,255,.32);
    --shadow:0 12px 34px -12px rgba(0,0,0,.75);
    --hot:#ef8a80;
  }

  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    margin:0;background:var(--sky-b);color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ink-2);outline-offset:3px}

  /* ── 空 ── */
  .sky{position:fixed;inset:0;z-index:0;
    background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 56%,var(--sky-c) 100%);
    transition:background 1s}
  .orb{position:fixed;z-index:0;width:150px;height:150px;border-radius:50%;
    right:22%;top:9%;pointer-events:none;
    background:radial-gradient(circle,var(--orb) 0 30%,var(--orb-glow) 33%,transparent 68%)}
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--star);
    transition:opacity 1.2s;
    background-image:
      radial-gradient(1.4px 1.4px at 8% 14%,#fff 50%,transparent 52%),
      radial-gradient(1px 1px at 17% 32%,#fff 50%,transparent 52%),
      radial-gradient(1.6px 1.6px at 26% 9%,#fff 50%,transparent 52%),
      radial-gradient(1px 1px at 34% 22%,#dfe4ff 50%,transparent 52%),
      radial-gradient(1.2px 1.2px at 44% 6%,#fff 50%,transparent 52%),
      radial-gradient(1px 1px at 52% 27%,#fff 50%,transparent 52%),
      radial-gradient(1.5px 1.5px at 61% 12%,#fff6d8 50%,transparent 52%),
      radial-gradient(1px 1px at 69% 30%,#fff 50%,transparent 52%),
      radial-gradient(1.3px 1.3px at 83% 7%,#fff 50%,transparent 52%),
      radial-gradient(1px 1px at 91% 24%,#fff 50%,transparent 52%),
      radial-gradient(1.2px 1.2px at 12% 58%,#fff 50%,transparent 52%),
      radial-gradient(1px 1px at 88% 52%,#fff 50%,transparent 52%),
      radial-gradient(1.4px 1.4px at 94% 70%,#dfe4ff 50%,transparent 52%),
      radial-gradient(1px 1px at 5% 80%,#fff 50%,transparent 52%),
      radial-gradient(1.2px 1.2px at 40% 40%,#fff 50%,transparent 52%),
      radial-gradient(1px 1px at 76% 44%,#fff 50%,transparent 52%);
    animation:twinkle 6s ease-in-out infinite alternate}
  @keyframes twinkle{to{filter:brightness(.55)}}

  #stage{position:fixed;inset:0;z-index:1;display:block;width:100%;height:100%;
    touch-action:none;cursor:grab;outline:none}
  #stage.dragging{cursor:grabbing}
  #stage.pointing{cursor:pointer}

  /* ── 左上の見出し ── */
  .hud{position:fixed;z-index:30;pointer-events:none;
    top:calc(20px + env(safe-area-inset-top,0px));left:24px;
    max-width:min(360px,calc(100vw - 170px))}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.34em;
    color:var(--ink-3);display:flex;align-items:center;gap:10px}
  .eyebrow::after{content:"";width:34px;height:1px;background:var(--edge)}
  .hud h1{margin:8px 0 10px;font-weight:900;font-size:clamp(40px,7.5vw,72px);
    line-height:.95;letter-spacing:.03em}
  .hud p{margin:0;font-size:13.5px;line-height:1.75;color:var(--ink-2);text-shadow:0 0 10px var(--sky-a),0 0 3px var(--sky-a)}
  .tally{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;color:var(--ink-3)}
  .tally b{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:16px;
    color:var(--ink);letter-spacing:0;margin-left:5px}
  .tally .hot b{color:var(--hot)}

  /* ── 右上の道具 ── */
  .tools{position:fixed;z-index:30;display:flex;gap:8px;
    top:calc(20px + env(safe-area-inset-top,0px));right:18px}
  .tool{width:42px;height:42px;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;border:1px solid var(--edge);
    background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:var(--shadow);transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
  .tool:hover{transform:translateY(-2px)}
  .tool:active{transform:scale(.93)}
  .tool svg{width:18px;height:18px}

  /* ── 建物の名札 ── */
  .pins{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
  .pin{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    padding:4px 11px 4px 6px;border-radius:999px;
    font-size:12px;font-weight:700;letter-spacing:.02em;
    background:var(--glass-2);border:1px solid var(--edge);color:var(--ink);
    box-shadow:0 4px 14px -6px rgba(20,30,60,.4);
    transform-origin:50% 100%;will-change:transform;
    transition:background .2s,color .2s,opacity .25s}
  .pin i{width:15px;height:15px;border-radius:50%;background:var(--tone);
    border:2.5px solid var(--deep);flex:none}
  .pin::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:var(--stem,9px);
    margin-left:-.75px;background:var(--deep);opacity:.55}
  .pin.hot{background:var(--deep);color:var(--tone);border-color:transparent}
  .pin.hot i{background:var(--tone);border-color:var(--tone)}
  .pin.dim{opacity:.28}
  .pin.flag{box-shadow:0 0 0 2px var(--hot),0 4px 14px -6px rgba(20,30,60,.4)}

  /* ── 下の一覧 ── */
  .dock{position:fixed;z-index:30;left:0;right:0;display:flex;justify-content:center;
    bottom:calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none;
    transition:opacity .25s,transform .35s}
  .dock-in{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:999px;
    max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;
    background:var(--glass);border:1px solid var(--edge);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
  .dock-in::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;background:none;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 9px;border-radius:999px;
    font-size:12.5px;font-weight:700;color:var(--ink-2);transition:background .18s,color .18s}
  .chip i{width:9px;height:9px;border-radius:50%;background:var(--deep);flex:none}
  @media (min-width:641px){ body.sheet-open .dock{padding-right:432px} }
  .chip:hover,.chip.hot{background:var(--tone);color:var(--deep)}

  /* ── 開いたところ ── */
  .sheet{position:fixed;z-index:60;overflow-y:auto;overscroll-behavior:contain;
    top:calc(74px + env(safe-area-inset-top,0px));right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:min(400px,calc(100vw - 32px));
    background:var(--panel);border:1px solid var(--edge);border-radius:24px;
    box-shadow:0 24px 60px -20px rgba(10,16,40,.55);
    transform:translateX(calc(100% + 40px));visibility:hidden;
    transition:transform .5s cubic-bezier(.2,.9,.25,1),visibility 0s .5s}
  .sheet.on{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.9,.25,1),visibility 0s}
  .s-top{position:relative;overflow:hidden;background:var(--tone);padding:24px 24px 22px}
  .s-top .blob{position:absolute;right:-50px;top:-56px;width:220px;height:220px;
    background:var(--deep);opacity:.13;border-radius:58% 42% 38% 62% / 46% 54% 46% 54%}
  .s-art{position:relative;width:62px;height:62px;color:var(--deep);margin-bottom:10px}
  .s-art svg{width:62px;height:62px;display:block;overflow:visible}
  .s-place{position:relative;font-family:"IBM Plex Mono",monospace;font-size:10px;
    letter-spacing:.2em;color:var(--deep);opacity:.7;margin-bottom:4px}
  .s-top h2{position:relative;margin:0;font-weight:900;font-size:24px;line-height:1.3;
    color:var(--deep);padding-right:40px}
  .s-top .sub{position:relative;margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--deep);opacity:.8}
  .x{position:absolute;right:14px;top:14px;z-index:2;width:34px;height:34px;border-radius:50%;
    cursor:pointer;display:grid;place-items:center;font-size:17px;line-height:1;
    color:var(--deep);border:1px solid color-mix(in srgb,var(--deep) 30%,transparent);
    background:color-mix(in srgb,var(--deep) 8%,transparent);transition:transform .2s}
  .x:hover{transform:rotate(90deg)}
  .s-body{padding:20px 24px 26px;display:flex;flex-direction:column;gap:14px}
  .full{margin:0;font-size:14px;line-height:1.8;color:var(--ink-2)}
  .callout{font-size:13px;line-height:1.7;border-radius:12px;padding:12px 14px;color:var(--ink-2);
    background:color-mix(in srgb,var(--tone) 42%,transparent)}
  .callout.hot{background:color-mix(in srgb,#c2564d 14%,transparent)}
  .lines{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
  .lines li{position:relative;padding-left:17px;font-size:13px;line-height:1.7;color:var(--ink-2)}
  .lines li::before{content:"";position:absolute;left:3px;top:.78em;width:5px;height:5px;
    border-radius:50%;background:var(--deep);opacity:.65}
  .openbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;
    border-radius:14px;text-decoration:none;background:var(--deep);color:var(--tone);
    font-weight:900;font-size:15px;letter-spacing:.05em;transition:opacity .16s,transform .16s}
  .openbtn:hover{opacity:.88}
  .openbtn:active{transform:scale(.985)}
  .limits{border:1px dashed var(--edge);border-radius:12px;padding:11px 14px}
  .limits-h{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;
    color:var(--ink-3);margin-bottom:6px}
  .limits ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
  .limits li{position:relative;padding-left:15px;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
  .limits li::before{content:"×";position:absolute;left:2px;top:0;font-size:11px;color:var(--ink-3)}
  .kv{display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--edge);padding-top:14px}
  .kvrow{display:flex;gap:12px;align-items:baseline;font-size:13px}
  .kvrow .k{flex:0 0 62px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
    letter-spacing:.16em;color:var(--ink-3)}
  .kvrow .v{flex:1;min-width:0;color:var(--ink-2)}
  .kvrow .v b{color:var(--ink)}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{border-radius:14px;padding:14px 15px;background:color-mix(in srgb,var(--tone) 38%,transparent);
    display:flex;flex-direction:column;gap:8px}
  .c-name{font-weight:900;font-size:16px;color:var(--ink)}
  .c-sub{margin:0;font-size:12.5px;line-height:1.65;color:var(--ink-2)}
  .openbtn.sm{padding:11px;font-size:13.5px;border-radius:11px}
  .c-meta{font-size:12px}
  .ghlink{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .synced{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3)}
  .synced::before{content:"✓ ";color:#4f9b6a}
  .kvrow.work .v b,.kvrow.hold .v b{color:var(--hot)}
  .pathrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pathbox{flex:1;min-width:160px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
    background:var(--ghost);border-radius:8px;padding:8px 11px;overflow-x:auto;white-space:nowrap}
  .copy{flex:none;cursor:pointer;border:0;border-radius:999px;padding:7px 15px;
    font-size:12.5px;font-weight:700;background:var(--ink);color:var(--panel)}
  .copy.done{background:var(--deep);color:var(--tone)}

  .nogl .pins{display:none}
  .nogl-msg{display:none}
  .nogl .nogl-msg{display:block;position:fixed;z-index:25;left:50%;top:50%;
    transform:translate(-50%,-50%);max-width:320px;text-align:center;padding:22px 24px;
    border-radius:20px;background:var(--glass-2);border:1px solid var(--edge);
    font-size:14px;line-height:1.8;color:var(--ink-2)}

  @media (max-width:640px){
    .hud{left:16px;max-width:calc(100vw - 140px)}
    .hud p{font-size:12.5px}
    .tools{right:12px;gap:6px}
    .tool{width:38px;height:38px}
    .pin{font-size:11px;padding:3px;gap:0}
    .pin i{width:13px;height:13px;border-width:2.5px}
    .pin span{display:none}
    .pin.hot{padding:3px 9px 3px 3px}
    .pin.hot span{display:inline;margin-left:5px}
    .sheet{top:auto;left:10px;right:10px;width:auto;max-height:60vh;
      bottom:calc(10px + env(safe-area-inset-bottom,0px));
      transform:translateY(calc(100% + 40px))}
    body.sheet-open .dock{opacity:0;pointer-events:none;transform:translateY(20px)}
    body.sheet-open .hud{opacity:0}
    .hud{transition:opacity .25s}
    .orb{width:110px;height:110px;right:8%;top:14%}
  }
  @media (prefers-reduced-motion: reduce){
    .stars{animation:none}
    .sheet,.sheet.on,.dock,.tool,.pin{transition:none}
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>
<div class="orb" aria-hidden="true"></div>

<canvas id="stage" aria-label="10棟の建物が並ぶ浮き島。建物を押すと中身が開く" role="img"></canvas>

<div class="pins" id="pins"></div>

<header class="hud">
  <div class="eyebrow">WORKSHOP ISLAND</div>
  <h1>作業島</h1>
  <p>作ってきた10点が、それぞれ建物になった島。ドラッグで回せる。建物を押すと中身が開く。</p>
  <div class="tally">
    <span>建物<b id="tAll">10</b></span>
    <span>GitHub<b id="tGh">0</b></span>
    <span>公開中<b id="tLive">0</b></span>
    <span class="hot">要手当<b id="tWork">0</b></span>
  </div>
</header>

<div class="tools">
  <button class="tool" id="rotL" type="button" aria-label="左に回す">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  </button>
  <button class="tool" id="rotR" type="button" aria-label="右に回す">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
  </button>
  <button class="tool" id="home" type="button" aria-label="島全体を見る">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button class="tool" id="mode" type="button" aria-label="夜にする"></button>
</div>

<nav class="dock" aria-label="建物の一覧"><div class="dock-in" id="dock"></div></nav>

<aside class="sheet" id="sheet" aria-labelledby="sTitle" role="dialog"></aside>

<div class="nogl-msg">この端末では3D表示が使えないので、下の一覧から開いてね。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ================================================================
   作品データ
   ================================================================ */
const ART = {
  kakeibo:`<rect x="14" y="40" width="12" height="24" rx="3" fill="currentColor" opacity=".45"/><rect x="31" y="24" width="12" height="40" rx="3" fill="currentColor"/><rect x="48" y="46" width="12" height="18" rx="3" fill="currentColor" opacity=".68"/><path d="M14 16l14 10 12-8 18 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".4"/>`,
  recipe:`<rect x="17" y="13" width="40" height="50" rx="5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M33 13h11v26l-5.5-6-5.5 6z" fill="currentColor"/><g stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".42"><path d="M24 24h6"/><path d="M24 33h6"/><path d="M24 42h13"/><path d="M24 51h18"/></g>`,
  tabi:`<path d="M12 56c9-2 11-17 21-17s11 11 21 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8" opacity=".5"/><path d="M44 10c6.6 0 12 5.4 12 12 0 8.6-12 20-12 20s-12-11.4-12-20c0-6.6 5.4-12 12-12z" fill="currentColor"/><circle cx="44" cy="22" r="4.4" fill="var(--tone)"/><circle cx="14" cy="54" r="3.4" fill="currentColor" opacity=".6"/>`,

/* ================================================================
   昼と夜
   ================================================================ */
let override = null;
function hostDark(){
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "dark") return true;
  if (t === "light") return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
const isNight = () => override ? override === "night" : hostDark();
let night = isNight();
let nightGoal = night ? 1 : 0, nightK = nightGoal;

const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.6A8.3 8.3 0 0 1 9.4 4a8.3 8.3 0 1 0 10.6 10.6z"/></svg>';

function toneOf(it){ return night ? {t:it.tintD,d:it.dpD} : {t:it.tint,d:it.dp}; }
function paintTones(){
  document.querySelectorAll("[data-key]").forEach(el=>{
    const c = toneOf(byKey[el.dataset.key]);
    el.style.setProperty("--tone",c.t); el.style.setProperty("--deep",c.d);
  });
}
function syncMode(){
  night = isNight();
  document.body.classList.toggle("is-night",night);
  document.body.classList.toggle("is-day",!night);
  nightGoal = night ? 1 : 0;
  if (RM) nightK = nightGoal;
  $("mode").innerHTML = night ? SUN : MOON;
  $("mode").setAttribute("aria-label", night ? "昼にする" : "夜にする");
  paintTones();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(!override) syncMode(); });
new MutationObserver(()=>{ if(!override) syncMode(); })
  .observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
$("mode").addEventListener("click",()=>{ override = night ? "day" : "night"; syncMode(); });

const pinsEl = $("pins"), dockEl = $("dock"), sheet = $("sheet");
const pinEls = {}, chipEls = {};
let hoverKey = null, focusKey = null, lastTrigger = null;

ITEMS.forEach(it=>{
  const p = document.createElement("button");
  p.type = "button"; p.className = "pin" + (it.broken ? " flag" : ""); p.dataset.key = it.key;
  p.innerHTML = "<i></i><span>" + esc(it.short) + "</span>";
  p.setAttribute("aria-label", it.name + "を開く");
  p.addEventListener("click", ()=>openItem(it.key,p));
  p.addEventListener("mouseenter", ()=>{ hoverKey = it.key; });
  p.addEventListener("mouseleave", ()=>{ if(hoverKey===it.key) hoverKey = null; });
  pinsEl.appendChild(p); pinEls[it.key] = p;

  const c = document.createElement("button");
  c.type = "button"; c.className = "chip"; c.dataset.key = it.key;
  c.innerHTML = "<i></i>" + esc(it.short);
  c.addEventListener("click", ()=>openItem(it.key,c));
  c.addEventListener("mouseenter", ()=>{ hoverKey = it.key; });
  c.addEventListener("mouseleave", ()=>{ if(hoverKey===it.key) hoverKey = null; });
  c.addEventListener("focus", ()=>{ hoverKey = it.key; });
  c.addEventListener("blur", ()=>{ if(hoverKey===it.key) hoverKey = null; });
  dockEl.appendChild(c); chipEls[it.key] = c;
});

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); const ok=document.execCommand("copy");
      document.body.removeChild(ta); return ok; }catch(e2){ return false; }
  }
}

function openItem(key, trigger){
  const it = byKey[key]; if(!it) return;
  lastTrigger = trigger || null;
  focusKey = key;
  const facts = [it.date]; if(it.size) facts.push(it.size);
  let b = '<p class="full">'+esc(it.full)+'</p>';
  if(it.note) b += '<div class="callout'+(it.broken?' hot':'')+'">'+esc(it.note)+'</div>';
  if(it.lines) b += '<ul class="lines">'+it.lines.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>';
  if(it.url) b += '<a class="openbtn" href="'+it.url+'" target="_blank" rel="noopener">ひらく <span aria-hidden="true">→</span></a>';
  if(it.choices) b += '<div class="choices">'+it.choices.map(c=>
    '<div class="choice"><div class="c-name">'+esc(c.label)+'</div><p class="c-sub">'+esc(c.sub)+'</p>'+
    '<a class="openbtn sm" href="'+c.url+'" target="_blank" rel="noopener">'+esc(c.label)+'をひらく <span aria-hidden="true">→</span></a>'+
    '<div class="c-meta"><a class="ghlink" href="'+c.repo+'" target="_blank" rel="noopener">GitHubで見る</a>'+
    '<span class="synced">'+esc(c.sync)+'</span></div></div>').join('')+'</div>';
  if(it.limits) b += '<div class="limits"><div class="limits-h">公開版で効かないところ</div><ul>'+
    it.limits.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul></div>';
  b += '<div class="kv">';
  b += '<div class="kvrow"><span class="k">FILE</span><span class="v">'+esc(facts.join(" / "))+'</span></div>';
  if(it.status!=="na") b += '<div class="kvrow '+it.status+'"><span class="k">STATUS</span><span class="v"><b>'+
    esc(STATUS[it.status])+'</b>'+(it.statusNote?' — '+esc(it.statusNote):'')+'</span></div>';
  if(it.repo) b += '<div class="kvrow"><span class="k">GITHUB</span><span class="v"><a class="ghlink" href="'+it.repo+'" target="_blank" rel="noopener">'+esc(it.repo.replace("https://github.com/",""))+'</a><span class="synced">Macの版と同じ（9/23確認）</span></span></div>';
  if(SHOW_PATHS) b += '<div class="kvrow"><span class="k">WHERE</span><span class="v"><span class="pathrow"><span class="pathbox">'+
    esc(it.path)+'</span><button type="button" class="copy">場所をコピー</button></span></span></div>';
  b += '</div>';

  sheet.dataset.key = key;
  sheet.innerHTML =
    '<div class="s-top"><span class="blob"></span>'+
      '<button class="x" type="button" aria-label="閉じる">×</button>'+
      '<div class="s-art"><svg viewBox="0 0 78 78" aria-hidden="true">'+ART[ARTKEY[key]]+'</svg></div>'+
      '<div class="s-place">'+esc(it.place)+'</div>'+
      '<h2 id="sTitle">'+esc(it.name)+'</h2>'+
      '<p class="sub">'+esc(it.sub)+'</p>'+
    '</div><div class="s-body">'+b+'</div>';
  paintTones();
  sheet.classList.add("on");
  document.body.classList.add("sheet-open");
  sheet.scrollTop = 0;
  sheet.querySelector(".x").addEventListener("click", closeItem);
  const cp = sheet.querySelector(".copy");
  if(cp) cp.addEventListener("click", async()=>{
    const ok = await copyText(it.path);
    cp.textContent = ok ? "コピーした" : "コピーできず"; cp.classList.toggle("done",ok);
    setTimeout(()=>{ cp.textContent="場所をコピー"; cp.classList.remove("done"); },1700);
  });
  setTimeout(()=>{ try{ sheet.querySelector(".x").focus({preventScroll:true}); }catch(e){} }, 60);
}
function closeItem(){
  if(!focusKey) return;
  focusKey = null;
  sheet.classList.remove("on");
  document.body.classList.remove("sheet-open");
  if(lastTrigger) try{ lastTrigger.focus({preventScroll:true}); }catch(e){}
}
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeItem();
});

function hasGL(){
  try{ const c=document.createElement("canvas");
    return !!(window.WebGLRenderingContext && (c.getContext("webgl")||c.getContext("experimental-webgl"))); }
  catch(e){ return false; }
}
if(!window.THREE || !hasGL()){ document.body.classList.add("nogl"); return; }

const T = THREE;
const canvas = $("stage");

renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;

const mats = {};
function M(hex, opts){
  const k = hex + (opts ? JSON.stringify(opts) : "");
  if(!mats[k]) mats[k] = new T.MeshStandardMaterial(Object.assign({color:hex,flatShading:true,roughness:.92,metalness:0},opts||{}));
  return mats[k];
}
const hx = s => parseInt(s.slice(1),16);
function mesh(g,m,x,y,z){ const o=new T.Mesh(g,m); o.position.set(x||0,y||0,z||0); o.castShadow=true; o.receiveShadow=true; return o; }
const B = (w,h,d) => new T.BoxGeometry(w,h,d);
const C = (rt,rb,h,s) => new T.CylinderGeometry(rt,rb,h,s||8);
const K = (r,h,s) => new T.ConeGeometry(r,h,s||8);
const ICO = (r,d) => new T.IcosahedronGeometry(r,d||0);
function prism(w,h,d){
  const s=new T.Shape(); s.moveTo(-d/2,0); s.lineTo(d/2,0); s.lineTo(0,h); s.lineTo(-d/2,0);
  const g=new T.ExtrudeGeometry(s,{depth:w,bevelEnabled:false}); g.translate(0,0,-w/2); g.rotateY(Math.PI/2); return g;
}

function win(w,h,x,y,z,side){ const o=new T.Mesh(side?B(.05,h,w):B(w,h,.05),winMat); o.position.set(x,y,z); return o; }
function door(w,h,x,y,z,col){ return mesh(B(w,h,.05),M(col||0x7a5a3e),x,y,z); }
function sign(text,w,h,bg,fg){
  const cv=document.createElement("canvas"); cv.width=256; cv.height=Math.round(256*h/w);
  const x=cv.getContext("2d"); x.fillStyle=bg; x.fillRect(0,0,cv.width,cv.height);

  x.font="700 "+Math.round(cv.height*.58)+"px 'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif";
  x.fillText(text,cv.width/2,cv.height/2+cv.height*.03);

  return new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex}));
}

/* ---------------- 島の地面 ---------------- */
function rrPath(p,hw,hh,r){
  p.moveTo(-hw+r,-hh); p.lineTo(hw-r,-hh); p.absarc(hw-r,-hh+r,r,-Math.PI/2,0,false);
  p.lineTo(hw,hh-r); p.absarc(hw-r,hh-r,r,0,Math.PI/2,false);
  p.lineTo(-hw+r,hh); p.absarc(-hw+r,hh-r,r,Math.PI/2,Math.PI,false);
  p.lineTo(-hw,-hh+r); p.absarc(-hw+r,-hh+r,r,Math.PI,Math.PI*1.5,false);
  return p;
}
const rr = (h,r) => rrPath(new T.Shape(),h,h,r);
function ringShape(o,i,ro,ri){ const s=rr(o,ro); s.holes.push(rrPath(new T.Path(),i,i,ri)); return s; }
function slab(shape,depth,mat,y,bevel){
  const g=new T.ExtrudeGeometry(shape,{depth,bevelEnabled:!!bevel,bevelSize:bevel||0,bevelThickness:bevel||0,bevelSegments:2,curveSegments:12});
  g.rotateX(-Math.PI/2); const m=new T.Mesh(g,mat); m.position.y=y; m.receiveShadow=true; return m;
}

function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const TR = 6.6, TRR = 2.2, TA = TR - TRR;
world.add(slab(ringShape(TR+.4,TR-.4,TRR+.4,TRR-.4),.05,M(0xd6cab1),0));
world.add(slab(ringShape(TR+.22,TR+.15,TRR+.22,TRR+.15),.045,M(0x8a8e99,{metalness:.45,roughness:.45}),.06));
world.add(slab(ringShape(TR-.15,TR-.22,TRR-.15,TRR-.22),.045,M(0x8a8e99,{metalness:.45,roughness:.45}),.06));
const SEG = [
  {t:"l",x:-TA,z:TR,dx:1,dz:0},{t:"a",cx:TA,cz:TA,a0:Math.PI/2},
  {t:"l",x:TR,z:TA,dx:0,dz:-1},{t:"a",cx:TA,cz:-TA,a0:0},
  {t:"l",x:TA,z:-TR,dx:-1,dz:0},{t:"a",cx:-TA,cz:-TA,a0:-Math.PI/2},
  {t:"l",x:-TR,z:-TA,dx:0,dz:1},{t:"a",cx:-TA,cz:TA,a0:-Math.PI}
];
SEG.forEach(s=>s.len = s.t==="l" ? 2*TA : Math.PI*TRR/2);
const TL = SEG.reduce((p,s)=>p+s.len,0);
function trackAt(s){
  s = ((s%TL)+TL)%TL;
  for(const g of SEG){
    if(s <= g.len){
      if(g.t==="l") return {x:g.x+g.dx*s, z:g.z+g.dz*s, rot:Math.atan2(-g.dz,g.dx)};
      const a = g.a0 - s/TRR, dx = Math.sin(a), dz = -Math.cos(a);
      return {x:g.cx+TRR*Math.cos(a), z:g.cz+TRR*Math.sin(a), rot:Math.atan2(-dz,dx)};
    }
    s -= g.len;
  }
  return {x:0,z:0,rot:0};
}
{
  const step=.34, n=Math.floor(TL/step);
  const ties = new T.InstancedMesh(B(.12,.035,.62),M(0x9c7b5b),n);
  const d = new T.Object3D();
  for(let i=0;i<n;i++){ const q=trackAt(i*step); d.position.set(q.x,.06,q.z); d.rotation.set(0,q.rot,0); d.updateMatrix(); ties.setMatrixAt(i,d.matrix); }
  ties.receiveShadow = true; world.add(ties);
}
function trackDist(x,z){
  const qx=Math.abs(x)-TA, qz=Math.abs(z)-TA;
  return Math.abs(Math.hypot(Math.max(qx,0),Math.max(qz,0))+Math.min(Math.max(qx,qz),0)-TRR);
}
function islandSD(x,z){
  const a=HALF-CORNER, qx=Math.abs(x)-a, qz=Math.abs(z)-a;
  return Math.hypot(Math.max(qx,0),Math.max(qz,0))+Math.min(Math.max(qx,qz),0)-CORNER;
}

  if(!focusKey){ goalT.set(0,0,0).addScaledVector(UPV, innerWidth/innerHeight<.8 ? 1.6 : -.9); return goalT; }
  const b=blds[focusKey]; b.base.getWorldPosition(bp); bp.y += b.h*.45;

const pointers=new Map(); let down=null, dragging=false, pinch=null, lastMove=null;
canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){ down={x:e.clientX,y:e.clientY,t:performance.now()}; dragging=false; yawVel=0; }
  if(pointers.size===2){ const p=[...pointers.values()]; pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),z:zoomGoal}; dragging=true; }
});
canvas.addEventListener("pointermove",e=>{
  const prev=pointers.get(e.pointerId);
  if(!prev){ if(e.pointerType==="mouse") lastMove={x:e.clientX,y:e.clientY}; return; }
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2 && pinch){
    const p=[...pointers.values()], d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    zoomGoal=Math.min(2.6,Math.max(.7,pinch.z*d/pinch.d)); return;
  }
  if(!down) return;
  if(!dragging && Math.hypot(e.clientX-down.x,e.clientY-down.y)>6){ dragging=true; canvas.classList.add("dragging"); hoverKey=null; }
  if(dragging){ const dx=e.clientX-prev.x; yaw+=dx*.0068; yawGoal=yaw; yawVel=dx*.0068; }
});
function endPointer(e){
  const wasDown=down;
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(pointers.size===0){
    canvas.classList.remove("dragging");
    if(wasDown && !dragging && e.type==="pointerup"){
      const k=pickAt(e.clientX,e.clientY);
      if(k) openItem(k,null); else closeItem();
    }
    down=null; dragging=false;
  }
}
canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",endPointer);
canvas.addEventListener("pointerleave",()=>{ lastMove=null; if(!pointers.size){ hoverKey=null; canvas.classList.remove("pointing"); } });
canvas.addEventListener("wheel",e=>{ e.preventDefault(); zoomGoal=Math.min(2.6,Math.max(.7,zoomGoal*Math.exp(-e.deltaY*.0012))); },{passive:false});

let last=performance.now(), t=0, pickDirty=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt;
  const ease=k=>RM?1:Math.min(1,dt*k);

  if(Math.abs(yawVel)>.0004 && !dragging){ yaw+=yawVel; yawVel*=.92; yawGoal=yaw; }
  else if(!dragging){ yaw+=(yawGoal-yaw)*ease(6); }
  world.rotation.y=yaw;
  world.position.y = RM ? 0 : Math.sin(t*.6)*.12;

  zoom+=(effZoom()-zoom)*ease(5);
  if(Math.abs(camera.zoom-zoom)>1e-4){ camera.zoom=zoom; camera.updateProjectionMatrix(); }
  target.lerp(goalTarget(),ease(4));
  camera.position.copy(target).addScaledVector(VIEW,60);

  if(Math.abs(nightK-nightGoal)>.001){ nightK+=(nightGoal-nightK)*ease(2.5); applyNight(nightK); }

  // 建物
  for(const key in blds){
    const b=blds[key], hot=(key===hoverKey||key===focusKey);
    b.lift+=((hot?1:0)-b.lift)*ease(9);
    b.g.position.y=b.lift*.32;
    b.g.scale.setScalar(1+b.lift*.05);
    if(b.anim) b.anim(RM?0:t,b.lift);
    if(b.puffs) runPuffs(b.puffs,RM?0:dt,null);
  }

  // 汽車
  if(!RM){
    const mid=trainS-1.02;
    let d=((mid-STATION_S)%TL+TL)%TL; if(d>TL/2) d-=TL;
    const f=.12+.88*Math.min(1,Math.abs(d)/3.2);
    trainS+=dt*1.5*f;
  }
  cars.forEach((c,i)=>{ const q=trackAt(trainS-i*1.02); c.position.set(q.x,.08,q.z); c.rotation.y=q.rot; });
  runPuffs(trainPuffs,RM?0:dt,locoChimney);

  floaters.forEach(f=>{ f.position.y=f.userData.float.y+(RM?0:Math.sin(t*.9+f.userData.float.ph)*.18); });

  // アヒル
  const da=t*.35; duck.position.set(POND.x+Math.cos(da)*.55,.08+Math.sin(t*2.2)*.012,POND.z+Math.sin(da)*.55); duck.rotation.y=-da-Math.PI/2;

  // 雲
  clouds.forEach(c=>{ if(!RM) c.a+=c.sp*dt; c.g.position.set(Math.cos(c.a)*c.r,c.y+Math.sin(t*.4+c.a)*.15,Math.sin(c.a)*c.r); });

  // マウスで指している建物
  if(lastMove && !down && ++pickDirty%2===0){
    const k=pickAt(lastMove.x,lastMove.y);
    if(k!==hoverKey && !(hoverKey && document.querySelector(".pin:hover,.chip:hover"))) hoverKey=k;
    canvas.classList.toggle("pointing",!!k);
  }

  renderer.render(scene,camera);

  // 名札（重なったら上にずらす）
  const W=innerWidth, H=innerHeight, list=[];
  for(const key in blds){
    const b=blds[key];
    pinV.set(0,b.h+.3,0); b.g.localToWorld(pinV); pinV.project(camera);
    const sz=pinSize[key]||(pinSize[key]={w:pinEls[key].offsetWidth,h:pinEls[key].offsetHeight});
    list.push({key,ax:(pinV.x*.5+.5)*W,ay:(-pinV.y*.5+.5)*H,w:sz.w,h:sz.h});
  }
  list.sort((a,b)=>b.ay-a.ay);
  const placed=[];
  for(const p of list){
    p.l=p.ax-p.w/2; p.t=p.ay-9-p.h;
    for(let n=0;n<8;n++){
      let moved=false;
      for(const q of placed){
        if(p.l<q.l+q.w+4 && p.l+p.w+4>q.l && p.t<q.t+q.h+3 && p.t+p.h+3>q.t){ p.t=q.t-p.h-3; moved=true; }
      }
      if(!moved) break;
    }
    placed.push(p);
    const el=pinEls[p.key], hot=(p.key===hoverKey||p.key===focusKey);
    const sy=pinY[p.key]===undefined ? p.t : pinY[p.key]+(p.t-pinY[p.key])*ease(12);
    pinY[p.key]=sy;
    el.style.transform="translate("+p.l.toFixed(1)+"px,"+sy.toFixed(1)+"px)";
    el.style.setProperty("--stem",Math.max(6,p.ay-(sy+p.h)).toFixed(1)+"px");
    el.style.zIndex=hot?50:Math.round(p.ay);
    el.classList.toggle("hot",hot);
    el.classList.toggle("dim",!!focusKey && p.key!==focusKey);
    chipEls[p.key].classList.toggle("hot",hot);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
